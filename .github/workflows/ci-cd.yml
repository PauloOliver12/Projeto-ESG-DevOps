name: CI/CD - ESG Compliance API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: esg-compliance-api

jobs:
  build-test:
    name: 1. Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, testar e empacotar (mvn verify)
        run: mvn -B clean verify

      - name: Resumo dos testes
        if: always()
        run: |
          tests=0; failures=0; errors=0; skipped=0
          for f in target/surefire-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            line="$(grep -m1 '<testsuite' "$f")"
            tests=$((tests + $(echo "$line" | sed -E 's/.* tests="([0-9]+)".*/\1/')))
            failures=$((failures + $(echo "$line" | sed -E 's/.* failures="([0-9]+)".*/\1/')))
            errors=$((errors + $(echo "$line" | sed -E 's/.* errors="([0-9]+)".*/\1/')))
            skipped=$((skipped + $(echo "$line" | sed -E 's/.* skipped="([0-9]+)".*/\1/')))
          done
          {
            echo "### Resultado dos testes"
            echo "| Total | Falhas | Erros | Ignorados |"
            echo "|---|---|---|---|"
            echo "| $tests | $failures | $errors | $skipped |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: target/surefire-reports/

      - name: Publicar artefato (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: esg-compliance-api-jar
          path: target/esg-compliance-api-*.jar

  integration-test:
    name: 2. Teste de integracao (Docker Compose)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir API + Oracle com Docker Compose
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Smoke test da stack
        env:
          SMOKE_USER: analyst
          SMOKE_PASSWORD: Analyst@123
        run: bash scripts/smoke-test.sh http://localhost:8080 local

      - name: Status e logs dos containers
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=150 app

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v

  publish-image:
    name: 3. Publicar imagem Docker (GHCR)
    needs: integration-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir tags da imagem
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="sha-${GITHUB_SHA::7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}:${version}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${owner}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "Imagem publicada: \`${{ steps.meta.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: 4. Deploy staging
    needs: publish-image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.publish-image.outputs.image }}
    secrets: inherit

  deploy-production:
    name: 5. Deploy producao
    needs: [publish-image, deploy-staging]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.publish-image.outputs.image }}
    secrets: inherit
