name: Deploy (reutilizavel)

# Faz o deploy de um ambiente (staging ou production) com Docker Compose.
#
# Dois modos, escolhidos automaticamente:
#   - servidor: se o environment tiver os secrets SSH_HOST, SSH_USER e SSH_PRIVATE_KEY,
#               o deploy e feito via SSH numa VM (ex.: Azure) e o ambiente fica no ar.
#   - runner:   sem esses secrets, o deploy e feito no proprio runner do GitHub Actions
#               (ambiente efemero, valido durante a execucao), com o mesmo smoke test.
#               Assim o pipeline funciona de ponta a ponta mesmo sem servidor.

on:
  workflow_call:
    inputs:
      environment:
        description: Nome do GitHub Environment (staging ou production)
        required: true
        type: string
      image:
        description: Imagem Docker a ser implantada
        required: true
        type: string

jobs:
  deploy:
    name: Deploy em ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ inputs.environment }}
      APP_IMAGE: ${{ inputs.image }}
      DEPLOY_DIR: esg-api/${{ inputs.environment }}
      PROJECT: esg-${{ inputs.environment }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      APP_PORT: ${{ vars.APP_PORT || (inputs.environment == 'production' && '8080' || '8081') }}
      JAVA_OPTS: ${{ vars.JAVA_OPTS || '-Xms256m -Xmx512m' }}
      ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      AUDITOR_PASSWORD: ${{ secrets.AUDITOR_PASSWORD }}
      ANALYST_PASSWORD: ${{ secrets.ANALYST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir modo de deploy
        id: modo
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "modo=servidor" >> "$GITHUB_OUTPUT"
            echo "Deploy via SSH no servidor configurado no environment '$TARGET_ENV'."
          else
            echo "modo=runner" >> "$GITHUB_OUTPUT"
            echo "::notice::Servidor SSH nao configurado em '$TARGET_ENV': deploy sera feito no runner do GitHub Actions."
          fi

      - name: Validar segredos do servidor
        if: steps.modo.outputs.modo == 'servidor'
        run: |
          missing=0
          for v in ORACLE_PASSWORD DB_PASSWORD ADMIN_PASSWORD AUDITOR_PASSWORD ANALYST_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::'$v' nao configurado no environment '$TARGET_ENV'"
              missing=1
            fi
          done
          exit $missing

      - name: Gerar arquivo .env do ambiente
        run: |
          umask 077
          # No modo runner, segredos nao cadastrados recebem valores aleatorios (ambiente descartavel)
          gerar() { echo "Esg$(openssl rand -hex 10)"; }
          ORACLE_PASSWORD="${ORACLE_PASSWORD:-$(gerar)}"
          DB_PASSWORD="${DB_PASSWORD:-$(gerar)}"
          ADMIN_PASSWORD="${ADMIN_PASSWORD:-$(gerar)}"
          AUDITOR_PASSWORD="${AUDITOR_PASSWORD:-$(gerar)}"
          ANALYST_PASSWORD="${ANALYST_PASSWORD:-$(gerar)}"
          for s in "$ORACLE_PASSWORD" "$DB_PASSWORD" "$ADMIN_PASSWORD" "$AUDITOR_PASSWORD" "$ANALYST_PASSWORD"; do
            echo "::add-mask::$s"
          done
          {
            echo "COMPOSE_PROJECT_NAME=$PROJECT"
            echo "APP_ENV=$TARGET_ENV"
            echo "APP_VERSION=sha-${GITHUB_SHA::7}"
            echo "APP_IMAGE=$APP_IMAGE"
            echo "APP_PORT=$APP_PORT"
            echo "ORACLE_PASSWORD=$ORACLE_PASSWORD"
            echo "DB_USERNAME=projetof"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "AUDITOR_PASSWORD=$AUDITOR_PASSWORD"
            echo "ANALYST_PASSWORD=$ANALYST_PASSWORD"
            echo "JAVA_OPTS=$JAVA_OPTS"
          } > deploy.env
          # usado pelo smoke test autenticado
          echo "SMOKE_USER=analyst" >> "$GITHUB_ENV"
          echo "SMOKE_PASSWORD=$ANALYST_PASSWORD" >> "$GITHUB_ENV"

      # ------------------------- modo servidor (SSH) -------------------------
      - name: Configurar SSH
        if: steps.modo.outputs.modo == 'servidor'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Copiar arquivos para o servidor
        if: steps.modo.outputs.modo == 'servidor'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p $DEPLOY_DIR"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" docker-compose.yml deploy.env scripts/smoke-test.sh \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"

      - name: Atualizar containers no servidor (docker compose pull + up)
        if: steps.modo.outputs.modo == 'servidor'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -e
            cd $DEPLOY_DIR
            mv deploy.env .env && chmod 600 .env
            docker compose -p $PROJECT pull
            docker compose -p $PROJECT up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            docker compose -p $PROJECT ps"

      - name: Smoke test no servidor
        if: steps.modo.outputs.modo == 'servidor'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd $DEPLOY_DIR && SMOKE_USER='$SMOKE_USER' SMOKE_PASSWORD='$SMOKE_PASSWORD' bash smoke-test.sh http://localhost:$APP_PORT $TARGET_ENV"

      - name: Logs da aplicacao no servidor (em caso de falha)
        if: failure() && steps.modo.outputs.modo == 'servidor'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd $DEPLOY_DIR && docker compose -p $PROJECT logs --tail=200" || true

      # ------------------------- modo runner (GitHub Actions) -------------------------
      - name: Login no GitHub Container Registry
        if: steps.modo.outputs.modo == 'runner'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir containers no runner (docker compose pull + up)
        if: steps.modo.outputs.modo == 'runner'
        run: |
          # -f explicito: o override (build local) nao e usado no deploy, so a imagem publicada
          docker compose -f docker-compose.yml --env-file deploy.env -p "$PROJECT" pull
          docker compose -f docker-compose.yml --env-file deploy.env -p "$PROJECT" up -d --remove-orphans
          docker compose -f docker-compose.yml --env-file deploy.env -p "$PROJECT" ps

      - name: Smoke test no runner
        if: steps.modo.outputs.modo == 'runner'
        run: bash scripts/smoke-test.sh "http://localhost:$APP_PORT" "$TARGET_ENV"

      - name: Coletar evidencias do runner
        if: always() && steps.modo.outputs.modo == 'runner'
        run: |
          mkdir -p evidencias
          C="docker compose -f docker-compose.yml --env-file deploy.env -p $PROJECT"
          $C ps -a > "evidencias/$TARGET_ENV-containers.txt" 2>&1 || true
          $C logs --tail=300 app > "evidencias/$TARGET_ENV-app.log" 2>&1 || true
          curl -s "http://localhost:$APP_PORT/actuator/health" > "evidencias/$TARGET_ENV-health.json" || true
          curl -s "http://localhost:$APP_PORT/actuator/info" > "evidencias/$TARGET_ENV-info.json" || true
          cat "evidencias/$TARGET_ENV-containers.txt"

      - name: Publicar evidencias
        if: always() && steps.modo.outputs.modo == 'runner'
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ inputs.environment }}
          path: evidencias/
          retention-days: 30

      # ------------------------- comum -------------------------
      - name: Resumo do deploy
        run: |
          {
            echo "### Deploy em \`$TARGET_ENV\` concluido"
            echo "- Modo: \`${{ steps.modo.outputs.modo }}\`"
            echo "- Imagem: \`$APP_IMAGE\`"
            echo "- Porta: \`$APP_PORT\`"
            if [ "${{ steps.modo.outputs.modo }}" = "runner" ]; then
              echo "- Info: \`$(curl -s http://localhost:$APP_PORT/actuator/info)\`"
            else
              echo "- URL: ${{ vars.APP_URL }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remover chave SSH e .env
        if: always()
        run: rm -f ~/.ssh/deploy_key deploy.env
