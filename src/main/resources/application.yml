spring:
  application:
    name: esg-compliance-api
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:projetof}
    password: ${DB_PASSWORD:projetof123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      initialization-fail-timeout: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    connect-retries: 60

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: esg-compliance-api
    environment: ${APP_ENV:local}
    version: ${APP_VERSION:local}

app:
  security:
    admin-password: ${ADMIN_PASSWORD:Admin@123}
    auditor-password: ${AUDITOR_PASSWORD:Auditor@123}
    analyst-password: ${ANALYST_PASSWORD:Analyst@123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

